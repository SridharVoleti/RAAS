name: Build Android APK

# Builds an installable (sideload) Android APK of the Krishnamargam app shell.
# The app itself just loads https://srikrishnamargam.in in a native WebView
# (see capacitor.config.ts), so this workflow only needs to package the
# Capacitor/Android project — no Next.js build or secrets required.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile-shell/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishnamargam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
