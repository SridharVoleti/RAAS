[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    e2e: End-to-end Playwright browser tests
    api: HTTP API integration tests
    auth: Authentication area
    courses: Course discovery area
    enrollment: Enrollment area
    learning: Learning experience area
    profile: Profile area
    admin: Admin dashboard area
    security: Security / edge-case checks
